name: Keep Supabase Alive

on:
  schedule:
    # Se ejecuta automáticamente cada 3 días a las 12:00 UTC (evita la pausa de Supabase por inactividad de 7 días)
    - cron: '0 12 */3 * *'
  workflow_dispatch: # Permite probarlo manualmente con un clic en GitHub

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping a la tabla portal_config de Supabase
        run: |
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET \
            "${{ secrets.SUPABASE_URL }}/rest/v1/portal_config?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}")
          
          echo "Supabase HTTP Status Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 400 ]; then
            echo "✅ Supabase está activo y respondiendo exitosamente."
          else
            echo "❌ Error al contactar Supabase. Código HTTP: $HTTP_STATUS"
            exit 1
          fi
